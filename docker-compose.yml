services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: slae
      POSTGRES_PASSWORD: slae
      POSTGRES_DB: slae
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  api1:
    build: ./backend
    environment:
      INSTANCE_NAME: api1
    depends_on: [postgres, redis]

  api2:
    build: ./backend
    environment:
      INSTANCE_NAME: api2
    depends_on: [postgres, redis]

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2]

volumes:
  pgdata: